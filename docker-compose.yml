name: superapp

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      FIXED_USER_ID: ${FIXED_USER_ID}
      FIXED_USER_EMAIL: ${FIXED_USER_EMAIL}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/vps:/sql:ro
      - ./db/vps/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET}
      PGRST_DB_POOL: 5
    deploy:
      resources:
        limits:
          memory: 128m

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      AUTH_MODE: fixed
      HOST: 0.0.0.0
      PORT: 3000
      POSTGREST_URL: http://rest:3000
      POSTGREST_TOKEN: ${POSTGREST_TOKEN}
      SUPABASE_SCHEMA: public
      FIXED_USER_ID: ${FIXED_USER_ID}
      FIXED_USER_EMAIL: ${FIXED_USER_EMAIL}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  db-data:
