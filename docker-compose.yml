# Super App na VPS (estáticos + /api/*).
# Persistência: Supabase cloud (não sobe Postgres local neste compose).
# Mensageria WhatsApp já na mesma VPS: use URL HTTPS da mensageria (DuckDNS/TLS).
# O código atual recusa WHATSAPP_API_ORIGIN em http:// (contrato do servidor).

name: superapp

services:
  super-app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: super-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Nunca ativar em produção — desliga auth real.
      OFFLINE_DEV: "false"
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://rate-limit:6379
    depends_on:
      rate-limit:
        condition: service_healthy
    networks:
      - default
      - rate-limit-internal
    ports:
      # Bind local até o DuckDNS/reverse-proxy; ajuste SUPERAPP_PUBLISH se precisar.
      - "${SUPERAPP_PUBLISH:-127.0.0.1:3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    # Opcional: mesma rede Docker da mensageria (DNS interno). HTTPS público ainda é
    # obrigatório em WHATSAPP_API_ORIGIN pelo código atual.
    # networks:
    #   - default
    #   - mensageria

  rate-limit:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - rate-limit-data:/data
    networks:
      - rate-limit-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true

volumes:
  rate-limit-data:

networks:
  default:
  rate-limit-internal:
    internal: true

