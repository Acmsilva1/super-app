# Super App na VPS — parity 1:1 com a Vercel (estáticos + /api/* + gateway Telegram Python).
# Persistência: Supabase cloud (não sobe Postgres local neste compose).
# Mensageria WhatsApp já na mesma VPS: use URL HTTPS da mensageria (DuckDNS/TLS).
# O código atual recusa WHATSAPP_API_ORIGIN em http:// (mesmo contrato da Vercel).

name: superapp

services:
  super-app:
    build: .
    container_name: super-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Nunca ativar em produção — desliga auth real.
      OFFLINE_DEV: "false"
    ports:
      # Bind local até o DuckDNS/reverse-proxy; ajuste SUPERAPP_PUBLISH se precisar.
      - "${SUPERAPP_PUBLISH:-127.0.0.1:3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    # Opcional: mesma rede Docker da mensageria (DNS interno). HTTPS público ainda é
    # obrigatório em WHATSAPP_API_ORIGIN / ALERTS_API_URL pelo código atual.
    # networks:
    #   - default
    #   - mensageria

# networks:
#   mensageria:
#     external: true
#     name: ${MENSAGERIA_DOCKER_NETWORK:-mensageria_default}
