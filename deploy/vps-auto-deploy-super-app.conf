# Cópia de referência para /opt/deploy/config/super-app.conf na VPS.
# O timer systemd vps-deploy.timer (a cada ~2 min) usa este BRANCH.
# PRODUÇÃO: sempre main — nunca feature/react-motion-modernization nem outra feature/*.
DIR=/opt/super-app
BRANCH=main
COMPOSE="docker compose"
SERVICES=""
HEALTH_CMD="curl -fsS --max-time 5 http://127.0.0.1:3000/healthz"
