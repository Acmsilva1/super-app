name: Alertas de Saude
# Agendador principal: systemd timer na VPS (superapp-saude-alertas.timer).
# Este workflow fica só para disparo manual de emergência apontando à VPS.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Agendador processa os horários devidos (envio pela mensageria do WhatsApp)'
        required: true
        type: choice
        default: scheduled
        options:
          - scheduled
permissions:
  contents: read
concurrency:
  group: saude-alertas
  cancel-in-progress: false
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Executar alertas na VPS (manual)
        env:
          SUPERAPP_URL: ${{ vars.SUPERAPP_URL || 'https://super-app-go.duckdns.org' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RUN_MODE: ${{ inputs.mode || 'scheduled' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SUPERAPP_URL" =~ ^https://[a-zA-Z0-9.-]+/?$ ]] || [[ ${#CRON_SECRET} -lt 32 ]]; then
            echo 'Configure SUPERAPP_URL e CRON_SECRET no GitHub.'
            exit 1
          fi
          headers=(-H "Authorization: Bearer $CRON_SECRET")
          result=$(curl --silent --show-error --max-time 170 --write-out $'\n%{http_code}' "${headers[@]}" "${SUPERAPP_URL%/}/api/saude-alertas-cron?mode=${RUN_MODE}")
          http_status="${result##*$'\n'}"
          body="${result%$'\n'*}"
          RESULT="$body" HTTP_STATUS="$http_status" python3 -c 'import json, os; data=json.loads(os.environ["RESULT"]); print("HTTP " + os.environ["HTTP_STATUS"] + ": " + json.dumps(data, ensure_ascii=False)); assert os.environ["HTTP_STATUS"] == "200" and data.get("ok") and data.get("processed"), "Agendador sem processamento"'
