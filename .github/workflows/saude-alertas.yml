name: Alertas de Saude
on:
  schedule:
    # Consulta a cada 5 min: continua lotes pendentes; chaves persistentes evitam duplicacao.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Teste envia água, dietas e Financeiro; agendador processa os horários devidos'
        required: true
        type: choice
        default: telegram_test
        options:
          - telegram_test
          - scheduled
permissions:
  contents: read
concurrency:
  group: saude-alertas
  cancel-in-progress: false
jobs:
  trigger:
    if: github.event_name == 'workflow_dispatch' || vars.SAUDE_ALERTS_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Executar alertas ou teste Telegram na Vercel
        env:
          SUPERAPP_URL: ${{ vars.SUPERAPP_URL || 'https://super-app-zeta-virid.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RUN_MODE: ${{ inputs.mode || 'scheduled' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SUPERAPP_URL" =~ ^https://[a-zA-Z0-9.-]+/?$ ]] || [[ ${#CRON_SECRET} -lt 32 ]]; then
            echo 'Configure SUPERAPP_URL e CRON_SECRET no GitHub.'
            exit 1
          fi
          headers=(-H "Authorization: Bearer $CRON_SECRET")
          if [[ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          result=$(curl --silent --show-error --max-time 170 --write-out $'\n%{http_code}' "${headers[@]}" "${SUPERAPP_URL%/}/api/saude-alertas-cron?mode=${RUN_MODE}")
          http_status="${result##*$'\n'}"
          body="${result%$'\n'*}"
          RESULT="$body" HTTP_STATUS="$http_status" RUN_MODE="$RUN_MODE" python3 -c 'import json, os; data=json.loads(os.environ["RESULT"]); print("HTTP " + os.environ["HTTP_STATUS"] + ": " + json.dumps(data, ensure_ascii=False)); expected=data.get("expected", 0); types={item.get("type") for item in data.get("results", [])}; success = isinstance(expected, int) and expected >= 4 and data.get("sent") == expected and {"health.water_progress", "health.diet_menu", "financeiro.daily_summary"}.issubset(types) if os.environ["RUN_MODE"] == "telegram_test" else data.get("processed"); assert os.environ["HTTP_STATUS"] == "200" and data.get("ok") and success, "Teste Telegram sem confirmação ou agendador sem processamento"'
